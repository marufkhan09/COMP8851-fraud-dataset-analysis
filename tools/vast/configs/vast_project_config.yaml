# Project runbook manifest, not an importable Vast.ai template.
# IMPORTANT: no command in this manifest launches or pays for a GPU.
project: COMP8851_Graph_Fraud_Benchmark
package_version: 3
run_status: BLOCKED_PENDING_VERIFIED_DATA_AND_ADAPTERS
provisioning:
  gpu: RTX_A6000
  gpu_count: 1
  vram_gb: 48
  rental_type: on_demand
  verified_host: true
  ssh_direct: true
  base_image: "vastai/base-image:@vastai-automatic-tag"
  working_root: /workspace/comp8851
  disk_policy:
    ideal_requested_gb: 120
    minimum_offer_capacity_for_ideal_gb: 145
    small_offer_requested_gb: 50
    small_offer_gb: 60
    small_offer_allowed_work: author_smoke_only_no_tsocial_full
    never_request_more_than_offer_capacity: true
    disk_resizing_after_rent: unsupported
  training_concurrency: 1
protocol:
  frozen_split_seed: 2
  training_seeds: [2, 42, 72]
  ratios: [0.40, 0.30, 0.20, 0.10]
  tuning_trials_per_model_dataset: 12
  tuning_only_tr40_seed2: true
  tuning_primary_metric: validation_AUPRC
  freeze_tr40_winner_across_ratios: true
  normal_max_epochs: 100
  normal_early_stopping_patience: 20
  model_native_schedule_exceptions_need_venus_approval: true
  test_peeking: forbidden
  expected_fits_for_3_models_x_6_datasets: 432
models:
  existing_10: [CARE-GNN, FRAUDRE, PC-GNN, GAGA, DGA-GNN, GAAP, BWGNN, GHRN, PMP, SplitGNN]
  proposed_3: [RGTAN, SAWGAD, EOGFD]
datasets: [YelpChi, Amazon, T-Finance, Elliptic, FDCompCN, T-Social]
requires_before_canonical_run:
  - validated_source_sha256
  - validated_split_sha256
  - verified_original_ass2_data_semantics
  - independent_model_environment
  - test_isolated_canonical_adapter
  - supervisor_decision_on_noncanonical_native_method
  - benchmark_evidence_run_manifest
sources_manifest: configs/source_lock.json
assets_template: configs/assets_manifest.json
blocked_job_plan: reports/blocked_job_plan.csv
