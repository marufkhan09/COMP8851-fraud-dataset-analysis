# Supplied repository configuration used for the successful local reproduction.
# This is not an exact paper reproduction because the available YelpChi features
# have dimension 32, this config uses 51 epochs, and it is currently a single run.

# Data
data_name: 'yelp'
data_dir: './data/'
train_ratio: 0.4
test_ratio: 0.67
save_dir: './pytorch_models/'
split_path: null

# Experiment recording
run_mode: 'author_reproduction'
results_dir: './results/author-reproduction'

# Model
model: 'PCGNN'
multi_relation: 'GNN'
emb_size: 64
thres: 0.5
rho: 0.5
seed: 72

# Optimisation
optimizer: 'adam'
lr: 0.01
weight_decay: 0.001
batch_size: 1024
num_epochs: 51
valid_epochs: 5
alpha: 2

# Device
no_cuda: True
cuda_id: '0'
